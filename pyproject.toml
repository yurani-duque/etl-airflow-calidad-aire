[project]
name = "etl-airflow-calidad-aire"
version = "0.1.0"
description = "ETL orquestado con Airflow y Great Expectations sobre clima, calidad del aire y emisiones"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
