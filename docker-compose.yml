name: etl-airflow-calidad-aire

x-airflow-common: &airflow-common
  image: etl-airflow-calidad-aire:latest
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  env_file: .env
  working_dir: /opt/airflow/app
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: etl-clima-jwt-secret-local-only
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    PROJECT_ROOT: /opt/airflow/app
    PYTHONPATH: /opt/airflow/app
    LOG_DIR: /opt/airflow/logs
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/app/src
    - ./utils:/opt/airflow/app/utils
    - ./config:/opt/airflow/app/config
    - ./data:/opt/airflow/app/data
    - ./dwh_version:/opt/airflow/app/dwh_version
    - ./gx:/opt/airflow/app/gx
    - ./test:/opt/airflow/app/test
    - ./dags:/opt/airflow/app/dags
    - ./logs:/opt/airflow/logs
  depends_on: &airflow-depends
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh_password
      POSTGRES_DB: dwh
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dwh", "-d", "dwh"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: ["airflow", "db", "migrate"]
    user: "50000:0"

  seed-source:
    <<: *airflow-common
    command: ["python", "-m", "src.seed_source_db"]
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-apiserver:
    <<: *airflow-common
    command: ["airflow", "api-server"]
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: ["airflow", "scheduler"]
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      seed-source:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: ["airflow", "dag-processor"]
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  tests:
    <<: *airflow-common
    profiles: ["test"]
    command: ["python", "-m", "pytest", "test/test_quality.py", "test/test_dag.py", "-q", "-p", "no:cacheprovider"]
    depends_on: {}

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    env_file: .env
    working_dir: /app
    environment:
      PROJECT_ROOT: /app
      PYTHONPATH: /app
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard
      - ./utils:/app/utils
      - ./config:/app/config
    depends_on:
      warehouse:
        condition: service_healthy
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  realtime:
    build:
      context: .
      dockerfile: docker/streaming.Dockerfile
    image: etl-airflow-calidad-aire-streaming:latest
    env_file: .env
    working_dir: /app
    environment: &streaming-env
      PROJECT_ROOT: /app
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8502:8502"
    volumes:
      - ./src:/app/src
      - ./utils:/app/utils
      - ./config:/app/config
      - ./models:/app/models
      - ./dashboard_realtime:/app/dashboard_realtime
    depends_on:
      warehouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["streamlit", "run", "dashboard_realtime/app.py", "--server.port=8502", "--server.address=0.0.0.0", "--server.headless=true"]

  trainer:
    image: etl-airflow-calidad-aire-streaming:latest
    profiles: ["train"]
    env_file: .env
    working_dir: /app
    environment: *streaming-env
    volumes:
      - ./src:/app/src
      - ./utils:/app/utils
      - ./config:/app/config
      - ./models:/app/models
    depends_on:
      warehouse:
        condition: service_healthy
    command: ["python", "-m", "src.train_model"]

  report:
    image: etl-airflow-calidad-aire-streaming:latest
    profiles: ["report"]
    env_file: .env
    working_dir: /app
    environment: *streaming-env
    volumes:
      - ./src:/app/src
      - ./utils:/app/utils
      - ./config:/app/config
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      warehouse:
        condition: service_healthy
    command: ["python", "-m", "reports.generate_report"]

  streaming-tests:
    image: etl-airflow-calidad-aire-streaming:latest
    profiles: ["test"]
    working_dir: /app
    environment: *streaming-env
    volumes:
      - ./src:/app/src
      - ./utils:/app/utils
      - ./config:/app/config
      - ./models:/app/models
      - ./test:/app/test
    command: ["python", "-m", "pytest", "test/test_ml_streaming.py", "-q", "-p", "no:cacheprovider"]

volumes:
  airflow-db-data:
  warehouse-data:
  kafka-data:
