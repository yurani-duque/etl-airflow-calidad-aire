project_name: etl-airflow-calidad-aire
sdg: "ODS 13 - Accion por el clima / ODS 11 - Ciudades sostenibles"

pipeline:
  staging_dir: data/staging
  dw_schema: dw
  source_schema: source

sources:
  weather_csv: data/raw/GlobalWeatherRepository.csv.gz
  owid_csv: data/raw/owid-co2-data.csv.gz
  owid_url: https://raw.githubusercontent.com/owid/co2-data/master/owid-co2-data.csv
  owid_table: owid_co2
  countries_map: config/paises_iso3.csv

api:
  air_quality_url: https://air-quality-api.open-meteo.com/v1/air-quality
  weather_url: https://api.open-meteo.com/v1/forecast
  min_past_days: 3
  max_past_days: 92
  chunk_size: 25
  timeout_seconds: 60
  max_retries: 4
  min_hours_per_day: 18

quality:
  who_pm25_24h: 15
